name: Build APK

on:
  push:
    branches: [ main, com-serial ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Uses the Android SDK preinstalled on the GitHub runner.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1" > sdk-install.log 2>&1 || { tail -n 50 sdk-install.log; exit 1; }
          tail -n 5 sdk-install.log
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # Retry: downloads from services.gradle.org sometimes time out on the runners.
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleDebug && exit 0
            echo "Build attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/Winlator-COM-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/*.apk out/Winlator-COM.apk
          ls -la out
          cd out && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-COM-APK
          path: out/Winlator-COM-*.apk
          retention-days: 30

      # Publishes the APK as a GitHub Release so it can be downloaded directly
      # (no zip, no login): .../releases/latest/download/Winlator-COM.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/Winlator-COM.apk out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Winlator COM - build ${GITHUB_RUN_NUMBER}" \
            --notes "Winlator com portas COM (USB serial). Commit ${GITHUB_SHA::7}. Baixe o arquivo Winlator-COM.apk."
